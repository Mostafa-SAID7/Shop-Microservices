name: 🐳 Docker — Build & Push

on:
  push:
    branches: [ master ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to build (comma-separated, or "all")'
        required: false
        default: 'all'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  DOTNET_NOLOGO: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Determine which services changed to avoid rebuilding everything
  # ─────────────────────────────────────────────────────────────────────────────
  changed-services:
    name: 🔍 Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      catalog:      ${{ steps.filter.outputs.catalog }}
      cart:         ${{ steps.filter.outputs.cart }}
      discount:     ${{ steps.filter.outputs.discount }}
      ordering:     ${{ steps.filter.outputs.ordering }}
      tracking:     ${{ steps.filter.outputs.tracking }}
      payment:      ${{ steps.filter.outputs.payment }}
      identity:     ${{ steps.filter.outputs.identity }}
      notification: ${{ steps.filter.outputs.notification }}
      gateway:      ${{ steps.filter.outputs.gateway }}
      web:          ${{ steps.filter.outputs.web }}

    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            catalog:
              - 'src/Services/Catalog/**'
              - 'src/BuildingBlocks/**'
            cart:
              - 'src/Services/Cart/**'
              - 'src/BuildingBlocks/**'
            discount:
              - 'src/Services/Discount/**'
            ordering:
              - 'src/Services/Ordering/**'
              - 'src/BuildingBlocks/**'
            tracking:
              - 'src/Services/Tracking/**'
              - 'src/BuildingBlocks/**'
            payment:
              - 'src/Services/Payment/**'
              - 'src/BuildingBlocks/**'
            identity:
              - 'src/Services/Identity/**'
              - 'src/BuildingBlocks/**'
            notification:
              - 'src/Services/Notification/**'
              - 'src/BuildingBlocks/**'
            gateway:
              - 'src/ApiGateways/**'
            web:
              - 'src/WebApps/**'

  # ─────────────────────────────────────────────────────────────────────────────
  # Build & push each service image (matrix)
  # ─────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: 🐳 Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: changed-services

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: catalog.api
            dockerfile: src/Services/Catalog/Catalog.API/Dockerfile
            image: catalogapi
            changed: ${{ needs.changed-services.outputs.catalog }}

          - service: cart.api
            dockerfile: src/Services/Cart/Cart.API/Dockerfile
            image: cartapi
            changed: ${{ needs.changed-services.outputs.cart }}

          - service: discount.grpc
            dockerfile: src/Services/Discount/Discount.Grpc/Dockerfile
            image: discountgrpc
            changed: ${{ needs.changed-services.outputs.discount }}

          - service: ordering.api
            dockerfile: src/Services/Ordering/Ordering.API/Dockerfile
            image: orderingapi
            changed: ${{ needs.changed-services.outputs.ordering }}

          - service: tracking.api
            dockerfile: src/Services/Tracking/Tracking.API/Dockerfile
            image: trackingapi
            changed: ${{ needs.changed-services.outputs.tracking }}

          - service: payment.api
            dockerfile: src/Services/Payment/Payment.API/Dockerfile
            image: paymentapi
            changed: ${{ needs.changed-services.outputs.payment }}

          - service: identity.api
            dockerfile: src/Services/Identity/Identity.API/Dockerfile
            image: identityapi
            changed: ${{ needs.changed-services.outputs.identity }}

          - service: notification.api
            dockerfile: src/Services/Notification/Notification.API/Dockerfile
            image: notificationapi
            changed: ${{ needs.changed-services.outputs.notification }}

          - service: yarpapigateway
            dockerfile: src/ApiGateways/YarpApiGateway/Dockerfile
            image: yarpapigateway
            changed: ${{ needs.changed-services.outputs.gateway }}

          - service: shopping.web
            dockerfile: src/WebApps/Shopping.Web/Dockerfile
            image: shoppingweb
            changed: ${{ needs.changed-services.outputs.web }}

    # Skip if service didn't change (unless tag push, master push, or manual dispatch with "all")
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      matrix.changed == 'true'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔐 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build & Push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./src
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: 📋 Image Summary
        run: |
          echo "### 🐳 ${{ matrix.service }} pushed" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
