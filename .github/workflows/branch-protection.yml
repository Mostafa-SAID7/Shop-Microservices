name: 🛡️ Apply Branch Protection Rules

# This workflow applies branch protection rules programmatically using the GitHub CLI.
# It is triggered manually (workflow_dispatch) or on pushes to master that touch this file.
# The GITHUB_TOKEN must have 'administration: write' permission (requires a PAT with
# repo-level admin rights stored as the secret ADMIN_PAT).

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/branch-protection.yml'

permissions:
  contents: read

jobs:
  protect:
    name: 🛡️ Apply Branch Protection
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ── master branch protection ────────────────────────────────────────────
      - name: 🔒 Protect master branch
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}
        run: |
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/branches/master/protection \
            -f required_status_checks='{"strict":true,"contexts":["🔨 Build Solution","🧪 Unit Tests","🔗 Integration Tests","✅ All Tests Gate","🎨 dotnet-format Gate","🔍 CodeQL Analysis"]}' \
            -f enforce_admins=true \
            -f required_pull_request_reviews='{"dismiss_stale_reviews":true,"require_code_owner_reviews":true,"required_approving_review_count":1,"require_last_push_approval":true}' \
            -f restrictions=null \
            -f allow_force_pushes=false \
            -f allow_deletions=false \
            -f block_creations=false \
            -f required_conversation_resolution=true \
            -f lock_branch=false \
            -f allow_fork_syncing=true
          echo "✅ master branch protection applied."

      # ── develop branch protection ───────────────────────────────────────────
      - name: 🔒 Protect develop branch
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}
        run: |
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/branches/develop/protection \
            -f required_status_checks='{"strict":true,"contexts":["🔨 Build Solution","🧪 Unit Tests","🎨 dotnet-format Gate"]}' \
            -f enforce_admins=false \
            -f required_pull_request_reviews='{"dismiss_stale_reviews":true,"require_code_owner_reviews":true,"required_approving_review_count":1}' \
            -f restrictions=null \
            -f allow_force_pushes=false \
            -f allow_deletions=false \
            -f required_conversation_resolution=true
          echo "✅ develop branch protection applied."

      - name: 📋 Summary
        run: |
          echo "### 🛡️ Branch Protection Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | Required Checks | Approvals | CODEOWNERS | Dismiss Stale |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|----------------|-----------|------------|---------------|" >> $GITHUB_STEP_SUMMARY
          echo "| master | Build + Unit + Integration + Format + CodeQL | 1 | ✅ | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| develop | Build + Unit + Format | 1 | ✅ | ✅ |" >> $GITHUB_STEP_SUMMARY
